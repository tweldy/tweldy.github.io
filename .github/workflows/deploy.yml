name: Deploy to GitHub Pages

# This site is deliberately dependency-free: plain HTML, CSS and vanilla JS,
# no package.json and no build step. So there is nothing to compile — we
# publish the repository root exactly as it sits.
#
# (The previous version of this file ran `npm ci && npm run build` and
# published `dist/`. That was left over from an abandoned Vite scaffold and
# would have failed on the first push, since there is no package.json.)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # The site IS the repo root. Jekyll processing is skipped via
          # the .nojekyll file so nothing gets rewritten on the way out.
          path: "."

      - id: deployment
        uses: actions/deploy-pages@v4
